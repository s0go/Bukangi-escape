<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukangi Escape</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; min-height: 100vh; background: #030712;
    display: flex; justify-content: center; align-items: center; font-family: 'Pretendard', sans-serif;
    user-select: none; overflow: hidden;
}
#gameBox {
    position: relative; width: min(1100px, 95vw); aspect-ratio: 16/9;
    overflow: hidden; border: 3px solid rgba(56, 189, 248, 0.4); border-radius: 20px; background: #0284c7;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); cursor: none;
}
canvas { width: 100%; height: 100%; display: block; }
#hud {
    position: absolute; top: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center;
    color: white; font-weight: 800; font-size: 18px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 5; pointer-events: none;
}
.progress-container {
    width: 320px; height: 16px; background: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px; overflow: hidden; position: relative;
}
.progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); transition: width 0.1s linear; }
.progress-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: 800; color: #fff; }
#menu { 
    position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; 
    backdrop-filter: blur(6px); background: rgba(3, 7, 18, 0.8); 
}
.panel {
    width: min(480px, 90%); padding: 32px; background: #0f172a;
    border: 2px solid #38bdf8; border-radius: 24px; color: white; text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8); cursor: default;
}
.panel h1 { font-size: 34px; font-weight: 900; margin: 0 0 6px; color: #38bdf8; letter-spacing: -1px; }
.panel .sub-title { font-size: 14px; font-weight: 700; color: #facc15; margin-bottom: 16px; }
.panel p { font-size: 14px; color: #cbd5e1; margin: 0 0 24px; line-height: 1.6; }
.btn-start {
    width: 100%; border: none; padding: 14px; border-radius: 12px; background: #38bdf8; color: #0f172a;
    font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(56,189,248,0.4);
}
.btn-start:hover { background: #7dd3fc; transform: translateY(-2px); }

#eventBanner {
    position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(239, 68, 68, 0.95); border: 2px solid #fde047; padding: 14px 28px; border-radius: 16px;
    color: white; font-weight: 900; font-size: 20px; text-align: center; z-index: 8;
    box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); display: none; pointer-events: none;
}
</style>
</head>
<body>

<div id="gameBox">
    <canvas id="game" width="1100" height="618"></canvas>
    
    <div id="hud">
        <div>DIST: <span id="distVal" style="color:#facc15;">0</span>m / 2000m</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text">세로형 수로 탈출 대작전</div>
        </div>
        <div>LIVES: <span style="color:#f87171;">❤️ 1 / 1</span></div>
    </div>

    <div id="eventBanner">⚠️ "부캉아 가지마!"<br>구경꾼들이 수로로 뛰어듭니다!</div>

    <div id="menu">
        <div class="panel" id="panelBox">
            <h1>BUKANGI ESCAPE</h1>
            <div class="sub-title">🦈 가로 화면 속 세로형 북항 탈출기</div>
            <p>마우스로 부캉이를 조종해 위에서 아래로 외해로 탈출하세요!<br>
            목숨은 단 1개! 나무 조각, 그물, 사람에게 닿으면 즉사합니다.<br>
            <b>1400m 지점</b>부터는 구경꾼들이 뛰어드니 조심하세요!</p>
            <button class="btn-start" onclick="startGame()">탈출 시작하기</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const distVal = document.getElementById("distVal");
const progressBar = document.getElementById("progressBar");
const menu = document.getElementById("menu");
const panelBox = document.getElementById("panelBox");
const eventBanner = document.getElementById("eventBanner");

const GOAL_DIST = 2000;
let state = "START";
let distance = 0;
let mousePos = { x: 550, y: 150 };

let bukang = {
    x: 550, y: 150, size: 24, angle: Math.PI / 2
};

let obstacles = [];
let fishes = [];
let humans = [];
let frame = 0;
let eventTriggered = false;
let deathReason = "";

// 가로 화면 중앙에 세로형 수로 통로 배치 (X축 350 ~ 750)
const laneLeft = 350;
const laneRight = 750;

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mousePos.x = (e.clientX - rect.left) * scaleX;
    mousePos.y = (e.clientY - rect.top) * scaleY;
});

function showMenu(isWin = false, reason = "") {
    menu.style.display = "flex";
    eventBanner.style.display = "none";
    if(isWin) {
        panelBox.innerHTML = `
            <h1 style="color:#4ade80;">ESCAPE CLEAR!</h1>
            <div class="sub-title" style="color:#4ade80;">🌊 북항 탈출 대성공!</div>
            <p>부캉이가 무사히 바다로 빠져나가 자유를 찾았습니다!</p>
            <button class="btn-start" onclick="startGame()">다시 플레이하기</button>
        `;
    } else {
        let endingTitle = "BAD ENDING";
        let endingDesc = "";
        
        if(reason === "WOOD") {
            endingTitle = "BAD ENDING : 찔린 부캉이";
            endingDesc = "표류하던 부서진 나무 갑판에 치명상을 입고 쓸쓸히 가라앉은 부캉이...";
        } else if(reason === "NET") {
            endingTitle = "BAD ENDING : 그물에 걸린 부캉이";
            endingDesc = "불법 유도 그물에 옴짝달싹 못 하게 감겨 밀렵꾼에게 잡혀버린 부캉이...";
        } else if(reason === "HUMAN") {
            endingTitle = "BAD ENDING : 애완 부캉이";
            endingDesc = "사람들에게 붙잡혀 졸지에 목줄이 채여 집에서 키워지게 된 부캉이...";
        } else {
            endingTitle = "BAD ENDING : 수로 충돌";
            endingDesc = "수로 벽이나 장애물에 부딪혀 기력을 잃고 만 부캉이...";
        }

        panelBox.innerHTML = `
            <h1 style="color:#f87171;">${endingTitle}</h1>
            <div class="sub-title" style="color:#f87171;">💥 목숨을 잃었습니다 (${Math.floor(distance)}m 도달)</div>
            <p>${endingDesc}</p>
            <button class="btn-start" onclick="startGame()">재도전하기</button>
        `;
    }
}

function startGame() {
    menu.style.display = "none";
    distance = 0;
    bukang.x = 550; bukang.y = 150; bukang.angle = Math.PI / 2;
    obstacles = []; fishes = []; humans = []; frame = 0;
    eventTriggered = false;
    deathReason = "";
    state = "PLAYING";
}

function update() {
    if(state !== "PLAYING") return;
    frame++;

    let dx = mousePos.x - bukang.x;
    let dy = mousePos.y - bukang.y;
    let dist = Math.hypot(dx, dy);

    if(dist > 3) {
        bukang.x += dx * 0.09;
        bukang.y += dy * 0.09;
        bukang.angle = Math.atan2(dy, dx);
    }

    // 좌우 수로 벽 충돌 체크 (목숨 1개 즉사)
    if(bukang.x - bukang.size < laneLeft || bukang.x + bukang.size > laneRight) {
        deathReason = "WALL";
        state = "GAMEOVER";
        showMenu(false, deathReason);
        return;
    }

    // 거리 증가 (위에서 아래로 전진)
    distance += 0.85;
    distVal.textContent = Math.floor(distance);
    progressBar.style.width = Math.min(100, (distance / GOAL_DIST) * 100) + "%";

    if(distance >= 1400 && !eventTriggered) {
        eventTriggered = true;
        eventBanner.style.display = "block";
        setTimeout(() => { eventBanner.style.display = "none"; }, 3000);
    }

    // 장애물 생성 (위에서 아래로 흘러내려옴)
    if(frame % 50 === 0) {
        let types = ["WOOD", "NET", "BUOY"];
        let type = types[Math.floor(Math.random() * types.length)];
        let obsX = Math.random() * (laneRight - laneLeft - 100) + laneLeft + 50;
        obstacles.push({ x: obsX, y: -50, type: type, size: type === "WOOD" ? 38 : 28, rot: Math.random() * Math.PI });
    }

    // 1400m 이후 사람들 난입 이벤트 (좌우 벽에서 튀어나옴)
    if(distance >= 1400 && frame % 40 === 0) {
        let spawnX = Math.random() < 0.5 ? laneLeft : laneRight;
        humans.push({ x: spawnX, y: Math.random() * 400 + 100, targetX: spawnX === laneLeft ? laneLeft + 120 : laneRight - 120, size: 22 });
    }

    if(frame % 90 === 0) {
        let fishX = Math.random() * (laneRight - laneLeft - 80) + laneLeft + 40;
        fishes.push({ x: fishX, y: -50, size: 14 });
    }

    // 장애물 이동 & 충돌 (아래로 이동)
    obstacles.forEach((obs) => {
        obs.y += 5.0;
        let d = Math.hypot(bukang.x - obs.x, bukang.y - obs.y);
        if(d < bukang.size + obs.size) {
            deathReason = obs.type;
            state = "GAMEOVER";
            showMenu(false, deathReason);
        }
    });

    humans.forEach((h) => {
        h.y += 4.5;
        h.x += (h.targetX - h.x) * 0.05;
        let d = Math.hypot(bukang.x - h.x, bukang.y - h.y);
        if(d < bukang.size + h.size) {
            deathReason = "HUMAN";
            state = "GAMEOVER";
            showMenu(false, deathReason);
        }
    });

    fishes.forEach((f) => {
        f.y += 4.0;
    });

    obstacles = obstacles.filter(o => o.y < 700);
    humans = humans.filter(h => h.y < 700);
    fishes = fishes.filter(f => f.y < 700);

    if(distance >= GOAL_DIST) {
        state = "WIN";
        showMenu(true);
    }
}

function draw() {
    ctx.clearRect(0, 0, 1100, 618);

    // 전체 가로형 배경 (바다)
    let grad = ctx.createLinearGradient(0, 0, 0, 618);
    grad.addColorStop(0, "#030712");
    grad.addColorStop(1, "#0f172a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1100, 618);

    // 중앙 세로형 수로 배경 (파란 바다)
    let laneGrad = ctx.createLinearGradient(laneLeft, 0, laneRight, 0);
    laneGrad.addColorStop(0, "#0284c7");
    laneGrad.addColorStop(0.5, "#0369a1");
    laneGrad.addColorStop(1, "#0284c7");
    ctx.fillStyle = laneGrad;
    ctx.fillRect(laneLeft, 0, laneRight - laneLeft, 618);

    // 세로형 수로 좌우 콘크리트 벽면 테두리
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(laneLeft, 0); ctx.lineTo(laneLeft, 618);
    ctx.moveTo(laneRight, 0); ctx.lineTo(laneRight, 618);
    ctx.stroke();

    // 숭어
    fishes.forEach(f => {
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.size/2, f.size, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    // 장애물 그리기
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        
        if(obs.type === "WOOD") {
            ctx.rotate(obs.rot);
            ctx.fillStyle = "#78350f";
            ctx.fillRect(-obs.size, -obs.size/2, obs.size*2, obs.size);
            ctx.fillStyle = "#92400e";
            ctx.fillRect(-obs.size+4, -obs.size/2+4, obs.size*1.5, obs.size-8);
            ctx.strokeStyle = "#451a03"; ctx.lineWidth = 2;
            ctx.strokeRect(-obs.size, -obs.size/2, obs.size*2, obs.size);
        } else if(obs.type === "NET") {
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3;
            ctx.strokeRect(-obs.size, -obs.size, obs.size*2, obs.size*2);
            ctx.beginPath();
            ctx.moveTo(-obs.size, -obs.size); ctx.lineTo(obs.size, obs.size);
            ctx.moveTo(obs.size, -obs.size); ctx.lineTo(-obs.size, obs.size);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#dc2626";
            ctx.beginPath(); ctx.arc(0, 0, obs.size, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fef08a";
            ctx.beginPath(); ctx.arc(0, 0, obs.size/2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    });

    // 뛰어드는 사람들
    humans.forEach(h => {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fca5a5";
        ctx.beginPath(); ctx.arc(0, -5, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    });

    // 상어 부캉이 (세로 유영 방향)
    ctx.save();
    ctx.translate(bukang.x, bukang.y);
    ctx.rotate(bukang.angle);

    ctx.fillStyle = "#334155";
    ctx.beginPath();
    ctx.ellipse(0, 0, bukang.size + 12, bukang.size - 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(-5, -bukang.size + 6);
    ctx.lineTo(-18, -bukang.size - 10);
    ctx.lineTo(8, -bukang.size + 6);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-bukang.size - 5, 0);
    ctx.lineTo(-bukang.size - 22, -16);
    ctx.lineTo(-bukang.size - 16, 0);
    ctx.lineTo(-bukang.size - 22, 16);
    ctx.fill();

    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.ellipse(5, 4, bukang.size, bukang.size - 16, 0, 0, Math.PI);
    ctx.fill();

    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(18, -4, 3, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // 마우스 조준점
    ctx.strokeStyle = "rgba(56, 189, 248, 0.8)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI * 2); ctx.stroke();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukangi Escape</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; min-height: 100vh; background: #030712;
    display: flex; justify-content: center; align-items: center; font-family: 'Pretendard', sans-serif;
    user-select: none; overflow: hidden;
}
#gameBox {
    position: relative; width: min(540px, 95vw); aspect-ratio: 9/16;
    overflow: hidden; border: 3px solid rgba(56, 189, 248, 0.4); border-radius: 20px; background: #0284c7;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); cursor: none;
}
canvas { width: 100%; height: 100%; display: block; }
#hud {
    position: absolute; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center;
    color: white; font-weight: 800; font-size: 16px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 5; pointer-events: none;
}
.progress-container {
    width: 180px; height: 14px; background: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px; overflow: hidden; position: relative;
}
.progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); transition: width 0.1s linear; }
.progress-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: 800; color: #fff; }
#menu { 
    position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; 
    backdrop-filter: blur(6px); background: rgba(3, 7, 18, 0.75); 
}
.panel {
    width: min(400px, 90%); padding: 28px; background: #0f172a;
    border: 2px solid #38bdf8; border-radius: 24px; color: white; text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8); cursor: default;
}
.panel h1 { font-size: 32px; font-weight: 900; margin: 0 0 6px; color: #38bdf8; letter-spacing: -1px; }
.panel .sub-title { font-size: 14px; font-weight: 700; color: #facc15; margin-bottom: 16px; }
.panel p { font-size: 13.5px; color: #cbd5e1; margin: 0 0 24px; line-height: 1.6; }
.btn-start {
    width: 100%; border: none; padding: 14px; border-radius: 12px; background: #38bdf8; color: #0f172a;
    font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(56,189,248,0.4);
}
.btn-start:hover { background: #7dd3fc; transform: translateY(-2px); }

/* 700m 알림 배너 */
#eventBanner {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(239, 68, 68, 0.9); border: 2px solid #fde047; padding: 12px 24px; border-radius: 16px;
    color: white; font-weight: 900; font-size: 18px; text-align: center; z-index: 8;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); display: none; pointer-events: none;
    animation: pulse 0.5s infinite alternate;
}
@keyframes pulse { from { transform: translate(-50%, -50%) scale(0.95); } to { transform: translate(-50%, -50%) scale(1.05); } }
</style>
</head>
<body>

<div id="gameBox">
    <canvas id="game" width="540" height="960"></canvas>
    
    <div id="hud">
        <div>DIST: <span id="distVal" style="color:#facc15;">0</span>m</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text">외해 탈출 (1000m)</div>
        </div>
        <div>HP: <span id="hpVal" style="color:#4ade80;">100</span>%</div>
    </div>

    <div id="eventBanner" id="bannerText">⚠️ "부캉아 가지마!"<br>사람들이 뛰어듭니다!</div>

    <div id="menu">
        <div class="panel" id="panelBox">
            <h1>BUKANGI ESCAPE</h1>
            <div class="sub-title">🦈 부캉이의 북항 탈출 대작전</div>
            <p>부산 북항 수로를 탈출하세요!<br>마우스로 위아래 유영하며 부서진 갑판, 부표, 구명튜브를 피하고<br><b>700m 지점</b>에서 뛰어드는 사람들을 조심하세요!</p>
            <button class="btn-start" onclick="startGame()">탈출 시작하기</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const distVal = document.getElementById("distVal");
const hpVal = document.getElementById("hpVal");
const progressBar = document.getElementById("progressBar");
const menu = document.getElementById("menu");
const panelBox = document.getElementById("panelBox");
const eventBanner = document.getElementById("eventBanner");

const GOAL_DIST = 1000;
let state = "START";
let distance = 0;
let mousePos = { x: 270, y: 750 };

let bukang = {
    x: 270, y: 750, size: 24, hp: 100, angle: -Math.PI / 2,
    invincibleUntil: 0
};

let obstacles = [];
let fishes = [];
let humans = [];
let frame = 0;
let eventTriggered = false;

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mousePos.x = (e.clientX - rect.left) * scaleX;
    mousePos.y = (e.clientY - rect.top) * scaleY;
});

function showMenu(isWin = false, isGameOver = false) {
    menu.style.display = "flex";
    eventBanner.style.display = "none";
    if(isWin) {
        panelBox.innerHTML = `
            <h1 style="color:#4ade80;">ESCAPE CLEAR!</h1>
            <div class="sub-title" style="color:#4ade80;">🌊 탈출 성공! (약 25초 기록)</div>
            <p>부캉이가 사람들 패닉을 뚫고 무사히 넓은 바다로 나갔습니다!</p>
            <button class="btn-start" onclick="startGame()">다시 도전하기</button>
        `;
    } else if(isGameOver) {
        panelBox.innerHTML = `
            <h1 style="color:#f87171;">GAME OVER</h1>
            <div class="sub-title" style="color:#f87171;">💥 탈출 실패!</div>
            <p>도착 거리: ${Math.floor(distance)}m</p>
            <button class="btn-start" onclick="startGame()">재도전하기</button>
        `;
    }
}

function startGame() {
    menu.style.display = "none";
    distance = 0;
    bukang.x = 270; bukang.y = 750; bukang.hp = 100; bukang.angle = -Math.PI / 2;
    obstacles = []; fishes = []; humans = []; frame = 0;
    eventTriggered = false;
    state = "PLAYING";
}

function update() {
    if(state !== "PLAYING") return;
    frame++;

    // 상어 유영 조작
    let dx = mousePos.x - bukang.x;
    let dy = mousePos.y - bukang.y;
    let dist = Math.hypot(dx, dy);

    if(dist > 4) {
        bukang.x += dx * 0.1;
        bukang.y += dy * 0.1;
        bukang.angle = Math.atan2(dy, dx);
    }

    // 좌우 수로 벽 충돌 체크
    const leftWall = 50, rightWall = 490;
    if(bukang.x - bukang.size < leftWall || bukang.x + bukang.size > rightWall) {
        bukang.hp -= 0.4;
    }

    // 약 25초 만에 1000m 완주되도록 거리 증가속도 설정 (프레임당 약 0.67m, 60fps = 초당 40m -> 25초=1000m)
    distance += 0.67;
    distVal.textContent = Math.floor(distance);
    hpVal.textContent = Math.max(0, Math.floor(bukang.hp));
    progressBar.style.width = Math.min(100, (distance / GOAL_DIST) * 100) + "%";

    // 700m 이벤트 실행
    if(distance >= 700 && !eventTriggered) {
        eventTriggered = true;
        eventBanner.style.display = "block";
        setTimeout(() => { eventBanner.style.display = "none"; }, 2500);
    }

    // 장애물 생성 (위에서 아래로 내려옴)
    if(frame % 35 === 0) {
        let types = ["DECK", "TUBE", "BUOY", "NET"];
        let type = types[Math.floor(Math.random() * types.length)];
        let obsX = Math.random() * (rightWall - leftWall - 80) + leftWall + 40;
        obstacles.push({ x: obsX, y: -60, type: type, size: type === "DECK" ? 40 : 25, rot: Math.random() * Math.PI });
    }

    // 700m 돌파 시 뛰어드는 사람들 난입!
    if(distance >= 700 && frame % 25 === 0) {
        let side = Math.random() < 0.5 ? "LEFT" : "RIGHT";
        let spawnX = side === "LEFT" ? leftWall : rightWall;
        let targetX = side === "LEFT" ? leftWall + Math.random() * 200 + 50 : rightWall - Math.random() * 200 - 50;
        humans.push({ x: spawnX, y: -40, targetX: targetX, vx: (targetX - spawnX) * 0.03, size: 22 });
    }

    // 숭어 생성 (먹이)
    if(frame % 75 === 0) {
        let fishX = Math.random() * (rightWall - leftWall - 60) + leftWall + 30;
        fishes.push({ x: fishX, y: -30, size: 12 });
    }

    let now = Date.now();

    // 장애물 이동 & 충돌
    obstacles.forEach((obs) => {
        obs.y += 6.5; // 아래로 스크롤
        let d = Math.hypot(bukang.x - obs.x, bukang.y - obs.y);
        if(d < bukang.size + obs.size && now > bukang.invincibleUntil) {
            bukang.hp -= 18;
            bukang.invincibleUntil = now + 800;
        }
    });

    // 뛰어든 사람 이동 & 충돌
    humans.forEach((h) => {
        h.y += 5.5;
        h.x += h.vx;
        let d = Math.hypot(bukang.x - h.x, bukang.y - h.y);
        if(d < bukang.size + h.size && now > bukang.invincibleUntil) {
            bukang.hp -= 22; // 사람 부딪히면 데미지 큼
            bukang.invincibleUntil = now + 800;
        }
    });

    // 숭어 먹기
    fishes.forEach((f, idx) => {
        f.y += 5.0;
        let d = Math.hypot(bukang.x - f.x, bukang.y - f.y);
        if(d < bukang.size + f.size) {
            bukang.hp = Math.min(100, bukang.hp + 12);
            fishes.splice(idx, 1);
        }
    });

    // 필터링
    obstacles = obstacles.filter(o => o.y < 1020);
    humans = humans.filter(h => h.y < 1020);
    fishes = fishes.filter(f => f.y < 1020);

    if(bukang.hp <= 0) {
        state = "GAMEOVER";
        showMenu(false, true);
    } else if(distance >= GOAL_DIST) {
        state = "WIN";
        showMenu(true, false);
    }
}

function draw() {
    ctx.clearRect(0, 0, 540, 960);

    // 1. 수로 바다 물결 배경
    let grad = ctx.createLinearGradient(0, 0, 0, 960);
    grad.addColorStop(0, "#0284c7");
    grad.addColorStop(1, "#0369a1");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 540, 960);

    // 좌우 수로 콘크리트 벽면
    ctx.fillStyle = "#334155";
    ctx.fillRect(0, 0, 40, 960);
    ctx.fillRect(500, 0, 40, 960);

    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 4;
    ctx.strokeRect(40, 0, 460, 960);

    // 2. 숭어(먹이)
    fishes.forEach(f => {
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.size/2, f.size, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    // 3. 리얼 그래픽 장애물 드로잉
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        
        if(obs.type === "DECK") {
            // 부서진 나무 갑판 (나무 파편)
            ctx.rotate(obs.rot);
            ctx.fillStyle = "#854d0e";
            ctx.fillRect(-obs.size, -obs.size/2, obs.size*2, obs.size);
            ctx.fillStyle = "#a16207";
            ctx.fillRect(-obs.size+4, -obs.size/2+4, obs.size*1.5, obs.size-8);
            ctx.strokeStyle = "#451a03"; ctx.lineWidth = 2;
            ctx.strokeRect(-obs.size, -obs.size/2, obs.size*2, obs.size);
        } else if(obs.type === "TUBE") {
            // 주황색 구명튜브
            ctx.strokeStyle = "#ea580c"; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.arc(0, 0, obs.size, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, obs.size, 0, Math.PI * 2); ctx.stroke();
        } else if(obs.type === "BUOY") {
            // 빨간색 해상 부표
            ctx.fillStyle = "#dc2626";
            ctx.beginPath(); ctx.arc(0, 0, obs.size, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fef08a";
            ctx.beginPath(); ctx.arc(0, 0, obs.size/2, 0, Math.PI * 2); ctx.fill();
        } else {
            // 유도 그물 (네트 그리드)
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3;
            ctx.strokeRect(-obs.size, -10, obs.size*2, 20);
            ctx.beginPath();
            for(let i = -obs.size; i < obs.size; i += 8) {
                ctx.moveTo(i, -10); ctx.lineTo(i, 10);
            }
            ctx.stroke();
        }
        ctx.restore();
    });

    // 4. 뛰어드는 사람 캐릭터
    humans.forEach(h => {
        ctx.save();
        ctx.translate(h.x, h.y);
        // 수영 도넛/구명조끼 입은 사람
        ctx.fillStyle = "#38bdf8"; // 바지/몸
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fde047"; // 노란 구명조끼
        ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fca5a5"; // 머리
        ctx.beginPath(); ctx.arc(0, -6, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    });

    // 5. 상어 '부캉이' (세로 유영 렌더링)
    let now = Date.now();
    let isInvic = now < bukang.invincibleUntil;

    ctx.save();
    ctx.translate(bukang.x, bukang.y);
    ctx.rotate(bukang.angle);

    if(!isInvic || Math.floor(now / 100) % 2 === 0) {
        // 부캉이 차콜 흑상어 바디
        ctx.fillStyle = "#334155";
        ctx.beginPath();
        ctx.ellipse(0, 0, bukang.size + 12, bukang.size - 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 지느러미
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.moveTo(-5, -bukang.size + 6);
        ctx.lineTo(-20, -bukang.size - 10);
        ctx.lineTo(8, -bukang.size + 6);
        ctx.fill();

        // 꼬리
        ctx.beginPath();
        ctx.moveTo(-bukang.size - 5, 0);
        ctx.lineTo(-bukang.size - 22, -16);
        ctx.lineTo(-bukang.size - 16, 0);
        ctx.lineTo(-bukang.size - 22, 16);
        ctx.fill();

        // 배
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.ellipse(5, 4, bukang.size, bukang.size - 16, 0, 0, Math.PI);
        ctx.fill();

        // 눈
        ctx.fillStyle = "#0f172a";
        ctx.beginPath(); ctx.arc(18, -4, 3, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    // 조작 커서 포인트
    ctx.strokeStyle = "rgba(56, 189, 248, 0.8)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10, 0, Math.PI * 2); ctx.stroke();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
